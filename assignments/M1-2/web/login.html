<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Secretary 로그인 확인</title>
  <style>
    body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#17343a;background:#f4f7f6}
    button{font:inherit;padding:9px 14px;margin:4px 6px 4px 0;border-radius:8px;border:1px solid #137e77;background:#fff;color:#137e77;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}
    pre{background:#fff;border:1px solid #dbe6e3;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all}
    small{color:#667a7b}
  </style>
</head>
<body>
  <!-- T02.01 최소 로그인 확인 페이지. 실제 화면 통합은 T02.03에서 한다. -->
  <h1>로그인 확인</h1>
  <p><small>Google 로그인 → UID 확인 → <code>/api/me</code> 호출로 서버 인증을 확인합니다.</small></p>
  <button id="sign-in">Google 로그인</button>
  <button id="sign-out" disabled>로그아웃</button>
  <button id="call-me">/api/me 호출</button>
  <label><small>모드</small>
    <select id="mode"><option value="personal">personal</option><option value="sample">sample</option></select>
  </label>
  <h2>상태</h2>
  <pre id="user">로그인하지 않음</pre>
  <h2>/api/me 응답</h2>
  <pre id="result">아직 호출하지 않음</pre>

  <script src="js/config.js"></script>
  <script type="module">
    import { apiFetch, onUserChanged, signIn, signOut } from "./js/auth.js";

    const $ = (id) => document.getElementById(id);
    const show = (id, text) => { $(id).textContent = text; };

    onUserChanged((user) => {
      $("sign-in").disabled = Boolean(user);
      $("sign-out").disabled = !user;
      // 첫 로그인 뒤 이 UID를 서버 .env의 OWNER_UID에 넣는다.
      show("user", user ? `로그인됨\nUID: ${user.uid}\n이메일: ${user.email ?? "-"}` : "로그인하지 않음");
    });

    $("sign-in").addEventListener("click", () => signIn().catch((e) => show("user", `로그인 실패: ${e.code ?? e.message}`)));
    $("sign-out").addEventListener("click", () => signOut());
    $("call-me").addEventListener("click", async () => {
      try {
        const res = await apiFetch("/api/me", { mode: $("mode").value });
        show("result", `HTTP ${res.status}\n${await res.text()}`);
      } catch (e) {
        show("result", `요청 실패: ${e.message} (서버 실행·ALLOWED_ORIGINS 확인)`);
      }
    });
  </script>
</body>
</html>
